# Seeed Human Detection Sensor Kit (MR24HPC1 radar + XIAO ESP32-C3) as the
# skull's motion sensor, with the radar's settings in Home Assistant.
#
# MOSI (GPIO10) goes high while someone is there: wire it to S, and GND to -,
# on the skull's PIR connector. That keeps working without WiFi or HA.
# Flash the first time over USB:  .venv-esphome/bin/esphome run radar/knekelbeen-radar.yaml
esphome:
  name: knekelbeen-radar
  friendly_name: Knekelbeen radar

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: arduino

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret radar_api_key

ota:
  - platform: esphome
    password: !secret radar_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# On the kit board: radar TX -> GPIO4, radar RX <- GPIO5.
uart:
  id: uart_bus
  baud_rate: 115200
  rx_pin: GPIO4
  tx_pin: GPIO5
  parity: NONE
  stop_bits: 1

seeed_mr24hpc1:
  id: radar

output:
  - platform: gpio
    pin: GPIO10  # "MOSI" on the kit's 6-pin header
    id: skull_pir

binary_sensor:
  - platform: seeed_mr24hpc1
    has_target:
      name: Aanwezig
      on_press:
        - output.turn_on: skull_pir
      on_release:
        - output.turn_off: skull_pir

text_sensor:
  - platform: seeed_mr24hpc1
    heart_beat:
      name: Hartslag
    motion_status:
      name: Beweging
    keep_away:
      name: Nadert of loopt weg

sensor:
  - platform: seeed_mr24hpc1
    movement_signs:
      name: Bewegingssterkte
    custom_presence_of_detection:
      name: Afstand stilstaand
    custom_motion_distance:
      name: Afstand bewegend
    custom_motion_speed:
      name: Snelheid

switch:
  - platform: seeed_mr24hpc1
    underlying_open_function:
      name: Afstand en snelheid meten

button:
  - platform: seeed_mr24hpc1
    restart:
      name: Radar herstarten
    custom_set_end:
      name: Eigen instellingen opslaan

select:
  - platform: seeed_mr24hpc1
    scene_mode:
      name: Scène
    unman_time:
      name: Tijd tot niemand
    existence_boundary:
      name: Grens aanwezigheid
    motion_boundary:
      name: Grens beweging

number:
  - platform: seeed_mr24hpc1
    sensitivity:
      name: Gevoeligheid
    custom_mode:
      name: Eigen modus
    existence_threshold:
      name: Drempel aanwezigheid
    motion_threshold:
      name: Drempel beweging
    motion_trigger:
      name: Tijd tot beweging
    motion_to_rest:
      name: Tijd van beweging naar stil
    custom_unman_time:
      name: Eigen tijd tot niemand
