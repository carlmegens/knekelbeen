[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3-WROOM-1 N8R8: 8MB QIO flash, 8MB octal PSRAM (uses GPIO 35-37)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles = web/index.html
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
lib_deps =
    madhephaestus/ESP32Servo@^3.0.6
    adafruit/Adafruit NeoPixel@^1.12.3

; Flash over USB (needs an unplug/replug afterwards)
[env:usb]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Flash over WiFi: pio run -e ota -t upload
; The board connects back to the laptop on port 40000; open it once with:
;   sudo ufw allow from 192.168.2.0/24 to any port 40000 proto tcp
[env:ota]
upload_protocol = espota
upload_port = 192.168.2.125
upload_flags =
    --auth=spookyota
    --host_port=40000
